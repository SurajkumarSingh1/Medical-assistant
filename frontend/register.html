<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - MediAssist</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- Left / Illustration -->
        <div class="auth-image">

            <div class="logo">
                🩺 <span>MediAssist</span>
            </div>

            <h1>Your AI Medical Assistant</h1>

            <p>
                Get health information, symptom guidance and
                general medical assistance with AI.
            </p>

            <div class="medical-icon">
                🩺
            </div>

        </div>


        <!-- Register Form -->
        <div class="auth-box">

            <div class="logo">
                🩺 <span>MediAssist</span>
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">
                Register to get started
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-button"
                >
                    Register
                </button>

            </form>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/register.js"></script>

</body>

</html>
